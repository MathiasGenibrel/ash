[package]
name = "ash"
# La seule source du numéro de version d'Ash. `tauri.conf.json` ne déclare plus de champ
# `version` : Tauri v2 retombe alors sur celle-ci, qui devient le CFBundleShortVersionString
# du bundle macOS. `package.json` la répète, et `scripts/release/version.ts --check vX.Y.Z`
# refuse un tag qui ne concorderait pas avec les deux.
version = "0.1.0"
description = "Un shell entouré, qui supervise les agents de code et rend git conscient d'eux"
edition = "2021"
rust-version = "1.97"
publish = false
# Le crate porte deux binaires depuis que `ash-event` existe ([[bin]] plus bas), et la CLI
# Tauri refuse d'empaqueter tant qu'on ne lui dit pas lequel est l'application : sans cette
# ligne, `bun run tauri build` s'arrête sur « failed to find main binary » et ne produit
# aucun bundle. `cargo build` et `bun run tauri dev` ne s'en plaignent pas — c'est pour ça
# que le défaut a vécu plusieurs jalons sans se voir.
default-run = "ash"

[lib]
# Nom distinct du binaire : sur macOS, une bibliothèque et un exécutable qui portent le
# même nom entrent en conflit à l'édition de liens.
name = "ash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Le client du socket d'événements d'ADR-0007, appelé à chaque hook d'un agent.
#
# Déclaré à part du binaire de l'application, et **sans dépendre de `ash_lib`** : lier
# Tauri lui ferait charger WebKit et AppKit pour écrire une ligne sur un socket. Il partage
# le format du fil avec la bibliothèque par inclusion de `features/agents/wire.rs`.
name = "ash-event"
path = "src/bin/ash-event.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["sync"] }
portable-pty = "0.9.0"
ulid = "3.0.0"
# `tcgetpgrp` et `proc_pidinfo` pour la sonde d'ADR-0005. Aucune nouvelle dépendance dans
# l'arbre : `portable-pty` tire déjà exactement cette version de `libc`, on la nomme.
libc = "0.2.189"
# La surveillance de `.git` (spec §5.3). Sur macOS, `notify` s'appuie sur FSEvents, qui
# est la seule façon d'observer `n` dépôts sans les sonder. Version épinglée : 8.2.0, la
# dernière stable — les 9.0.0-rc ne sont pas publiées en version finale. Fonctionnalités
# par défaut, qui se réduisent ici à `macos_fsevent` : ni `crossbeam-channel`, ni `serde`.
notify = "=8.2.0"
# Les notifications macOS de la spec §8 — un agent en `waiting` doit être vu même quand Ash
# est derrière une autre fenêtre, et le clic doit ramener sur l'agent concerné.
#
# **`tauri-plugin-notification` a été retiré ici**, il ne dort pas dans le fichier. Deux
# critères de la spec §8 lui étaient inatteignables — l'autorisation réelle, que son
# `permission_state()` de bureau rend en dur à `Granted`, et le clic, dont il jette la
# poignée —, et le délégué de `NSUserNotificationCenter` est global au processus : cohabiter
# aurait été deux couches se le disputant en silence. Voir `features/notifications/macos.rs`.
#
# Ces quatre crates étaient **déjà dans l'arbre**, tirées par Tauri et par `wry` ; on les
# nomme, exactement comme `libc` l'est pour la sonde. `objc2-user-notifications` est la
# liaison de `UserNotifications.framework`, la seule pile qui sache répondre aux deux
# critères. Versions retenues et leur date de publication : `objc2` 0.6.4 (2026-02-26),
# `objc2-foundation` 0.3.2, `objc2-user-notifications` 0.3.2 et `block2` 0.6.2 (2025-10-04).
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSString", "NSError"] }
# Le premier — et pour l'instant le seul — appel réseau d'Ash
# ([ADR-0016](../docs/adr/0016-ash-sort-sur-le-reseau.md)) : les quotas de session et
# hebdomadaires de la spec §4.2, qui ne sont dans aucun fichier de la machine.
#
# Version 3.4.0, publiée le 2026-08-08 — au-delà du seuil de fraîcheur de dix jours du
# dépôt. Bloquante et sans runtime asynchrone, ce qui *est* la propriété voulue : l'appel
# vit sur un fil de fond que personne n'attend (condition 1 de l'ADR).
#
# **Les fonctionnalités par défaut sont coupées, et le trio retenu est le seul qui réponde à
# la lettre à « TLS par le vérificateur de la plateforme, pas un magasin de racines
# embarqué » :**
#
# - `platform-verifier` est la phrase elle-même : `rustls-platform-verifier` demande à macOS
#   de valider la chaîne. Un poste sous MDM, ou derrière un proxy d'entreprise qui re-signe,
#   fonctionne sans qu'Ash ait son propre avis sur les autorités de certification.
# - `rustls-no-provider` plutôt que `rustls` : le second **ajoute** `rustls-webpki-roots`, et
#   les racines de Mozilla seraient alors compilées dans le binaire. C'est exactement le
#   magasin embarqué que l'ADR refuse, et une fonctionnalité de Cargo ne se retire pas —
#   elles s'additionnent. Il faut donc partir de la variante nue.
# - `_ring` fournit le fournisseur cryptographique que `rustls-no-provider` laisse vide.
#   Le tiret bas dit qu'`ureq` la tient pour interne, et on l'assume : sans elle, `ureq`
#   **panique au premier appel** au lieu de ne pas compiler. Le jour où elle disparaîtra,
#   `cargo` refusera une fonctionnalité inconnue — une panne bruyante au bon moment, et non
#   une panique dans une jauge. L'alternative serait de dépendre de `rustls` en direct pour
#   poser le fournisseur à la main : une crate nommée de plus pour la même chose.
#
# Ces trois-là ont été retenues **après** avoir essayé `native-tls`, qui *est* pourtant
# Security.framework sur macOS : `ureq` 3.4.0 ne compile son connecteur que derrière la
# fonctionnalité `native-tls`, laquelle entraîne `webpki-root-certs`. Le même magasin
# embarqué, par l'autre porte. C'est `bun run smoke` qui l'a montré, et pas la compilation.
#
# `gzip` n'est **pas** repris : la réponse fait quelques centaines d'octets. `json` non plus :
# `serde_json` est déjà dans l'arbre, et c'est lui qui lit la réponse — voir
# `features/usage/quota.rs`, dont toute la tolérance est testable parce qu'elle part d'une
# chaîne.
#
# `HTTPS_PROXY` est honoré sans rien demander : la configuration par défaut d'`ureq` lit
# `ALL_PROXY`, `HTTPS_PROXY` et `https_proxy` de l'environnement.
ureq = { version = "3.4.0", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
    "platform-verifier",
] }
objc2-user-notifications = { version = "0.3.2", features = [
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationTrigger",
    "block2",
] }

[dev-dependencies]
ts-rs = "12.0.1"

[lints.rust]
# `clippy -- -D warnings` en fait une erreur : tout `unsafe` doit donc être introduit
# par un `#![allow(unsafe_code)]` explicite et local. La sonde d'ADR-0005 en aura besoin,
# et c'est précisément le point — cet `allow` sera la trace visible de sa frontière.
unsafe_code = "warn"

[lints.clippy]
# `unwrap` et `expect` sont interdits hors tests et composition root — la convention du
# dépôt, rendue mécanique. Le composition root les lève localement avec `#[allow]`.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
